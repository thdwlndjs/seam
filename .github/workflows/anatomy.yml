# 해부도 사이트: 푸시할 때마다 코드에서 다시 만들어 GitHub Pages에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로.
name: anatomy

on:
  push:
    branches: [main]
  pull_request:          # PR에서는 만들어 보기만 하고(설명에 적힌 함수가 사라졌는지 확인), 배포는 안 한다
  workflow_dispatch:     # Actions 탭에서 손으로 다시 돌리기

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: anatomy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 해부도 만들기
        run: python anatomy/build.py --src . --out _site
      - name: PR이면 코드와 다른 부품이 있는지 확인
        if: github.event_name == 'pull_request'
        run: python anatomy/build.py --src . --out _site --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
