<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEAM PM Bot — Teams Playground</title>
<style>
:root{--bg:#f5f5f5;--panel:#fff;--chat:#fff;--ink:#242424;--muted:#666;--line:#e5e5e5;--soft:#f4f4f4;--brand:#6264a7;--brand-soft:#efeff8;--green:#107c41;--red:#c4314b;--shadow:0 2px 8px #00000012}
*{box-sizing:border-box}
body{margin:0;background:#e8e8e8;color:var(--ink);font:14px "Segoe UI",Arial,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.scenarios{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:12px;background:#242424;color:white}
.scenarios button{border:1px solid #777;background:transparent;color:#eee;padding:10px 16px;border-radius:8px;font-weight:600}
.scenarios button.active{background:#6264a7;border-color:#6264a7;color:white}
.app{height:calc(100vh - 58px);height:calc(100dvh - 58px);min-height:0;max-height:none;max-width:1440px;margin:auto;display:grid;grid-template-columns:68px 250px minmax(0,1fr);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.rail{background:#292929;color:#eee;display:flex;align-items:center;flex-direction:column;gap:22px;padding:20px 0}
.rail .logo{width:34px;height:34px;border-radius:9px;background:#6264a7;display:grid;place-items:center;font-weight:800}
.rail span{font-size:19px;opacity:.8}
.sidebar{background:#f8f8f8;border-right:1px solid var(--line);padding:20px 14px}
.org{font-size:16px;font-weight:700;margin-bottom:24px}
.side-title{font-size:11px;color:#777;font-weight:700;margin:20px 8px 8px}
.nav{padding:10px 9px;border-radius:6px;margin:3px 0;display:flex;gap:10px;align-items:center}
.nav.active{background:#e9e9f4;color:#45468a;font-weight:600}
.nav span{font-size:16px;width:18px;text-align:center}
.main{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;background:var(--chat);overflow:hidden}
.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar strong{font-size:15px}
.topbar small{color:var(--muted)}
.timeline{flex:1 1 0%;min-width:0;min-height:0;height:0;overflow-y:auto;overflow-x:hidden;padding:22px max(20px,calc((100% - 720px)/2));scroll-behavior:smooth;overscroll-behavior:contain}
.day{text-align:center;color:#888;font-size:11px;margin:4px 0 22px}
.msg{display:flex;gap:10px;margin:0 0 20px;align-items:flex-start}
.avatar{width:30px;height:30px;border-radius:8px;background:#6264a7;color:#fff;display:grid;place-items:center;flex-shrink:0;font-weight:700}
.msg-content{max-width:100%;min-width:0;flex:1}
.msg-head{font-size:12px;color:#666;margin-bottom:6px}
.bubble{background:#f4f4f4;border-radius:0 10px 10px 10px;padding:12px 14px;line-height:1.65;max-width:640px}
.user{justify-content:flex-end}
.user .msg-content{display:flex;flex-direction:column;align-items:flex-end;flex:0 1 auto}
.user .bubble{background:#e9e8f5;border-radius:10px 0 10px 10px}
.card{border:1px solid #ddd;border-radius:10px;background:#fff;overflow:hidden;max-width:640px;box-shadow:0 1px 3px #0000000a}
.card-head{padding:15px 16px 12px;border-bottom:1px solid #eee}
.card-head strong{font-size:15px}
.card-head p{margin:5px 0 0;color:#666;font-size:12px;line-height:1.5}
.card-body{padding:16px;min-height:210px}
.card-foot{padding:12px 16px;border-top:1px solid #eee;background:#fcfcfc}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field input,.field textarea,.composer input{width:100%;border:1px solid #c9c9c9;border-radius:5px;padding:10px;background:white;outline:none}
.field input:focus,.composer input:focus{border-color:#6264a7;box-shadow:0 0 0 1px #6264a7}
.help-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid #eee;color:#777;font-size:12px}
.btn{border:1px solid #bbb;border-radius:5px;background:white;padding:9px 13px;color:#333}
.btn.primary{background:#6264a7;border-color:#6264a7;color:white;font-weight:600}
.btn.text{border:0;color:#555;padding:5px;background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.full{width:100%}
.progress{display:flex;gap:5px;margin:0 0 17px}
.progress i{height:4px;border-radius:4px;background:#e6e6e6;flex:1}
.progress i.on{background:#6264a7}
.tag{display:inline-block;background:#efeff8;color:#55568f;padding:4px 8px;border-radius:20px;font-size:11px}
.success{color:var(--green);font-size:12px}
.guide{background:#f7f7fb;border:1px solid #e5e5f1;padding:14px;border-radius:7px;line-height:1.7}
.guide h4{margin:0 0 8px}
.guide ol{padding-left:20px;margin:8px 0}
.guide ul{padding-left:18px;margin:4px 0}
.guide li{margin:3px 0}
.guide a{color:#4f52b2}
.guide code{background:#ebebf5;border-radius:3px;padding:1px 5px;font-size:12px}
.guide-outro{margin-top:10px;padding-top:10px;border-top:1px solid #e5e5f1;color:#555}
.field input.err{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.field-error{margin-top:6px;color:var(--red);font-size:12px;line-height:1.5}
.field-error button{border:0;background:none;color:#4f52b2;padding:0;margin-left:4px;font-size:12px;text-decoration:underline}
.field select{width:100%;border:1px solid #c9c9c9;border-radius:5px;padding:10px;background:white;outline:none}
.field select:focus{border-color:#6264a7;box-shadow:0 0 0 1px #6264a7}
.foot-meta{display:flex;justify-content:space-between;color:#777;font-size:12px;margin-bottom:10px}
.done-title{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.done-ico{width:18px;height:18px;border-radius:50%;background:var(--green);display:inline-grid;place-items:center;flex-shrink:0}
.checkrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #eee}
.checkrow:last-child{border:0}
.checkrow input{accent-color:#6264a7}
.info-grid{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13px;line-height:1.5}
.info-grid span:nth-child(odd){color:#777}
.section-label{font-size:11px;color:#777;font-weight:700;margin:0 0 9px}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.quick button{background:white;border:1px solid #ddd;border-radius:18px;padding:7px 11px;font-size:12px}
.task-table{width:100%;border-collapse:collapse;font-size:12px}
.task-table th,.task-table td{text-align:left;padding:10px 7px;border-bottom:1px solid #eee}
.task-table th{color:#777;font-weight:600}
.status{font-size:11px;color:#8a5b00;background:#fff4ce;border-radius:12px;padding:3px 7px}
.status.ok{color:#107c41;background:#e7f5ec}
.composer-wrap{border-top:1px solid var(--line);padding:14px 20px 16px;flex-shrink:0}
.composer{max-width:720px;margin:auto;display:flex;gap:8px;align-items:center}
.composer input{height:42px;flex:1}
.send{width:42px;height:42px;border:0;border-radius:6px;background:#6264a7;color:white;font-size:17px}
.composer-note{max-width:720px;margin:7px auto 0;color:#999;font-size:10px}
.muted{color:#777}
.small{font-size:11px}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292929;color:#fff;padding:10px 16px;border-radius:7px;z-index:50}
/* v2 확장: 메뉴 결과·대기·시안 메모 */
.scenarios .opt{display:flex;align-items:center;gap:6px;margin-left:14px;padding-left:14px;border-left:1px solid #555;font-size:12px;color:#bbb}
.scenarios .opt button{padding:6px 10px;font-size:12px;font-weight:500}
.note{margin-top:8px;border:1px dashed #d9b84a;background:#fffbe8;color:#6b5600;border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.55;max-width:640px}
.note b{color:#5a4700}
body.hide-notes .note{display:none}
.spin{width:14px;height:14px;border:2px solid #d6d6ea;border-top-color:#6264a7;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-card{border:1px solid #e3e3ef;border-radius:10px;background:#fafafe;padding:14px 16px;max-width:640px;color:#555;font-size:13px}
.stats{display:flex;gap:8px;margin:2px 0 4px}
.stat{flex:1;border:1px solid #eee;border-radius:8px;padding:9px 10px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:#777}
.src{margin:0;padding-left:16px;font-size:12px;line-height:1.8;color:#555}
.src a{color:#4f52b2}
.chip{display:inline-block;font-size:10.5px;border-radius:10px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.chip.agreed{background:#e7f5ec;color:#107c41}
.chip.draft{background:#fff4ce;color:#8a5b00}
.chip.guess{background:#f1f1f1;color:#666;border:1px dashed #bbb}
.chip.gh{background:#eef3fb;color:#2a5aa8}
.coord-item{border:1px solid #eee;border-radius:8px;padding:11px 12px;margin-bottom:9px}
.coord-item .why{font-size:12px;color:#777;margin:4px 0 9px}
.coord-item .btn{padding:6px 10px;font-size:12px}
.coord-item.done{background:#fafafa;opacity:.75}
.issue{border:1px solid #eee;border-radius:8px;padding:11px 12px;margin-bottom:9px}
.issue.off{opacity:.45}
.issue .field{margin-bottom:8px}
.issue .field input,.issue .field select{padding:7px 9px}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-size:12px;color:#888}
.pick{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eee;font-size:13px}
.pick:last-child{border:0}
.pick small{display:block;color:#888;font-size:11.5px}
.drop{border:1.5px dashed #c9c9dd;border-radius:9px;background:#fafafe;padding:16px;text-align:center;color:#666;font-size:12.5px;line-height:1.6;cursor:pointer}
.drop b{color:#45468a}
.mem{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid #eee;font-size:12.5px}
.mem:last-child{border:0}
.mem .who b{display:block;font-size:13px}
.mem .who span{color:#888;font-size:11.5px}
.mem .what{line-height:1.55;color:#444}
.mem .what small{display:block;color:#888}
.file{display:flex;justify-content:space-between;align-items:center;border:1px solid #eee;border-radius:7px;padding:8px 10px;font-size:12.5px;margin-top:8px}
@media(max-width:850px){.app{grid-template-columns:52px minmax(0,1fr)}.sidebar{display:none}.timeline{padding:18px 14px}.scenarios button{font-size:11px;padding:8px}}
@media(max-width:520px){.scenarios{gap:4px}.scenarios button{padding:8px;font-size:10px}.app{height:calc(100vh - 54px);height:calc(100dvh - 54px);grid-template-columns:42px minmax(0,1fr)}.topbar{padding:0 12px}.timeline{padding:14px 10px}.card-body{padding:12px}}
</style>
</head>
<body>
<div class="scenarios">
  <button id="tabA" class="active" onclick="switchScenario('A')">A · 등록된 팀 없음</button>
  <button id="tabB" onclick="switchScenario('B')">B · 등록된 팀 있음</button>
  <button id="tabC" onclick="switchScenario('C')">C · 다시 접속</button>
  <div class="opt"><button id="noteBtn" class="active" onclick="toggleNotes()">시안 메모</button></div>
</div>

<div class="app">
  <aside class="rail">
    <div class="logo">S</div><span>◫</span><span>▦</span><span>▤</span><span>⚙</span>
  </aside>
  <aside class="sidebar">
    <div class="org">SEAM Workspace</div>
    <div class="side-title">즐겨찾기</div>
    <div class="nav active"><span>▣</span>채팅</div>
    <div class="nav"><span>◷</span>활동</div>
    <div class="nav"><span>▤</span>팀</div>
    <div class="side-title">채팅</div>
    <div class="nav active"><span>◉</span>SEAM PM Bot</div>
    <div class="side-title">앱</div>
    <div class="nav"><span>▦</span>대시보드</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><strong>SEAM PM Bot</strong><br><small>채팅 · 프로젝트 운영</small></div>
      <small>•••　⌕　⚙</small>
    </header>
    <section class="timeline" id="timeline">
      <div class="day">오늘</div>
      <div id="conversation"></div>
    </section>
    <footer class="composer-wrap">
      <div class="composer">
        <input id="messageInput" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="send" onclick="sendMessage()">➤</button>
      </div>
      <div class="composer-note">SEAM PM Bot은 채팅을 기본으로 사용하며, 입력·선택·승인 등 필요한 경우에만 작업 UI를 제공합니다.</div>
    </footer>
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const $=id=>document.getElementById(id);
let scenario='A',setupStep=0,guideOpen=false,setupData={},verified={},teamRegistered=false;
let activeTask=null,taskHistory=[],chatCount=0;

const steps=[
 {id:'notion',title:'팀 노션 페이지를 알려 주세요',desc:'페이지 링크와 연결 토큰 두 가지만 있으면 돼요.',fields:[
  ['notionPage','페이지 링크','https://www.notion.so/team-page'],
  ['notionToken','연결 토큰','ntn_로 시작해요']]},
 {id:'github',title:'팀 저장소를 알려 주세요',desc:'GitHub는 선택이에요. 저장소가 아직 없으면 나중에 해도 돼요.',optional:true,fields:[
  ['repo','저장소 주소','https://github.com/owner/repository'],
  ['githubToken','GitHub 토큰','ghp_로 시작해요']]},
 {id:'board',title:'작업 보드가 없네요',desc:'만들어 드릴까요? 할 일 · 진행 중 · 완료 칸이 있는 보드를 저장소에 붙여 드려요.',fields:[]}
];

const guides={
 github:{title:'GitHub 토큰 발급 가이드',items:[
  '<a href="https://github.com/settings/tokens" target="_blank" rel="noopener">https://github.com/settings/tokens</a> 접속 <span class="muted">(GitHub 우측 상단 프로필 → <b>Settings</b> → 왼쪽 메뉴 맨 아래 <b>Developer settings</b> → <b>Personal access tokens</b>)</span>',
  '<b>Generate new token (classic)</b> 선택 — Fine-grained 말고 꼭 <b>Classic</b>',
  '<b>Note</b>에 이름 아무거나(예: teamsAgent), 만료일 설정',
  '<b>Select scopes</b>에서 최상위 체크박스 딱 2개만 체크: <code>repo</code>, <code>project</code>',
  '맨 아래 <b>Generate token</b> → 나오는 <code>ghp_...</code> 토큰을 복사해서 토큰 입력칸에 붙여넣어 주세요'],
  outro:'토큰을 복사했다면 돌아가서 다시 입력해 주세요.'},
 notion:{title:'Notion 토큰 발급 가이드',items:[
  '<a href="https://app.notion.com/developers/connections" target="_blank" rel="noopener">https://app.notion.com/developers/connections</a> 접속',
  '<b>신규 연결</b> 선택',
  '이름 아무거나 입력하고, 아래 항목 체크<ul><li>콘텐츠 기능: 읽기, 업데이트, 삽입 (셋 다 체크)</li><li>이메일 주소를 포함한 사용자 정보 읽기</li></ul>',
  '만들어진 <b>액세스 토큰</b> 복사',
  '연결하려는 Notion 페이지로 가서 우측 상단 <b>···</b> → <b>Connections</b> → 방금 만든 integration 추가 <span class="muted">(이 연결을 안 해두면 페이지 검증 단계에서 계속 실패해요)</span>'],
  outro:'토큰을 복사했다면 돌아가서 다시 입력해 주세요.'}
};
const tokenRules={
 github:{field:'githubToken',re:/^(ghp_|github_pat_)\S+$/,format:'토큰 형식이 아니에요. ghp_로 시작하는 토큰을 공백 없이 다시 입력해 주세요.',auth:'이 토큰으로 GitHub 인증이 안 돼요. 토큰이 맞는지 다시 확인해 주세요.'},
 notion:{field:'notionToken',re:/^(ntn_|secret_)\S+$/,format:'토큰 형식이 아니에요. ntn_으로 시작하는 토큰을 공백 없이 다시 입력해 주세요.',auth:'이 토큰으로 Notion 인증이 안 돼요. 토큰이 맞는지 다시 확인해 주세요.'}
};
let stepError=null;
const roles=['기획·PM','프론트엔드','백엔드','디자인','데이터·AI','기타'];
let myRole='';

let qaMode=false,seq=0,coordState={};
function switchScenario(s){
 scenario=s;
 ['A','B','C'].forEach(k=>$('tab'+k).classList.toggle('active',s===k));
 setupStep=0;guideOpen=false;setupData={};verified={};activeTask=null;taskHistory=[];chatCount=0;
 stepError=null;myRole=s==='C'?'백엔드':'';teamRegistered=s==='C';roleCardSeq=0;qaMode=false;coordState={};
 renderInitial();
}
function toggleNotes(){document.body.classList.toggle('hide-notes');$('noteBtn').classList.toggle('active');}
function note(html){return `<div class="note"><b>시안 메모</b> · ${html}</div>`;}
function navRow(left=''){return `<div class="nav-row"><span>${left}</span><button class="btn text" onclick="quickAsk('메뉴')">☰ 메뉴로</button></div>`;}
// 대기 화면: 짧은 대기(1~5초)는 '확인하는 중' 카드를 띄웠다가 결과 카드로 바꿔 끼운다
function withLoading(label,ms,render){
 const id='ld'+(++seq);
 addBot(`<div class="loading-card" id="${id}"><span class="spin"></span>${label}</div>`);
 setTimeout(()=>{const el=$(id);if(!el)return;el.outerHTML=render();scrollBottom();},ms);
}
function now(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function addBot(html){$('conversation').insertAdjacentHTML('beforeend',`<div class="msg"><div class="avatar">S</div><div class="msg-content"><div class="msg-head">SEAM PM Bot</div>${html}</div></div>`);scrollBottom();}
function addUser(text){$('conversation').insertAdjacentHTML('beforeend',`<div class="msg user"><div class="msg-content"><div class="msg-head">나</div><div class="bubble">${escapeHtml(text)}</div></div></div>`);scrollBottom();}
function scrollBottom(){setTimeout(()=>$('timeline').scrollTop=$('timeline').scrollHeight,30);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1800);}

function renderInitial(){
  $('conversation').innerHTML='';
  if(scenario==='A'){
   addBot(`<div class="bubble">SEAM 파일럿팀이시네요 👋<br>아직 팀이 연결되지 않았어요. 노션만 연결하면 바로 시작할 수 있어요. GitHub는 선택이에요.</div>${note('<b>결정:</b> 명단(번호→팀)으로 팀 이름을 찾아 인사. 명단에 없는 사람은 "팀을 찾지 못했어요" 안내만.')}`);
   addBot(menuCard());
  }else if(scenario==='B'){
   addBot(`<div class="bubble">안녕하세요. SEAM PM Bot입니다.<br>팀 정보는 이미 등록되어 있어요. 시작하기 전에 내 역할만 알려주세요.</div>`);
   renderRoleCard();
  }else{

function startSetup(fromTypedMessage=false){
  if(!fromTypedMessage)addUser('설정');
  setupStep=0;guideOpen=false;setupData={};verified={};stepError=null;
  addBot(`<div class="bubble">노션부터 연결할게요. 노션이 확인되면 팀 연결이 끝나고, 이어서 GitHub(선택)와 작업 보드를 물어봐요.</div>`);
  renderSetupCard();
}
function renderSetupCard(){
  const step=steps[setupStep],isGuide=guideOpen&&!!guides[step.id];
  let body='';
  if(isGuide){
   const g=guides[step.id];
   body=`<div class="guide"><h4>${g.title}</h4><ol>${g.items.map(x=>`<li>${x}</li>`).join('')}</ol><div class="guide-outro">${g.outro}</div></div>`;
  }else if(step.id==='board'){
   body=`<p class="muted small">연결한 저장소에 열린 작업 보드가 없을 때만 보이는 단계예요. 보드가 이미 있으면 그 보드를 바로 연결해요.</p>`;
  }else{
   body=step.fields.map(([id,label,placeholder])=>{
    const err=stepError&&stepError.field===id;
    const errHtml=err?`<div class="field-error">⚠ ${stepError.msg}${stepError.guide?`<button onclick="toggleGuide(true)">발급 가이드 보기</button>`:''}</div>`:'';
    return `<div class="field"><label>${label}</label><input id="f_${id}" class="${err?'err':''}" type="${id.toLowerCase().includes('token')?'password':'text'}" placeholder="${placeholder||'입력하세요'}" value="${escapeHtml(setupData[id]||'')}" oninput="setupData['${id}']=this.value">${errHtml}</div>`;
   }).join('');
   if(step.id==='notion') body+=`<p class="muted small">노션은 필수예요. 확인되면 바로 팀 연결이 끝나요.</p>`;
  }
  const done=!!verified[step.id];
  const nextLabel=step.id==='board'?'만들어 주세요':done?'다음 단계':'연결하기';
  const action=step.id==='board'?'finishSetup(true,true)':`verifyStep('${step.id}')`;
  const skipRow=step.id==='github'?`<button class="btn full" style="margin-top:8px" onclick="finishSetup(false,false)">나중에 할게요</button>`
   :step.id==='board'?`<button class="btn full" style="margin-top:8px" onclick="finishSetup(true,false)">괜찮아요</button>`:'';
  const guideRow=guides[step.id]?`<div class="help-row"><span>입력 방법이 헷갈리나요?</span><button class="btn text" onclick="toggleGuide(true)">가이드 보기 →</button></div>`:'';
  const card=`<div class="card" id="setupCard">
  <div class="card-head"><div class="tag">${step.id==='board'?'팀 초기 설정 · 작업 보드':'팀 초기 설정 · '+(setupStep+1)+'/2'+(step.optional?' (선택)':'')}</div><strong style="display:block;margin-top:9px">${isGuide?'도움말 · '+step.title:step.title}</strong><p>${isGuide?'토큰 발급 방법을 확인합니다.':step.desc}</p></div>
  <div class="card-body"><div class="progress">${steps.slice(0,2).map((x,i)=>`<i class="${i<=setupStep?'on':''}"></i>`).join('')}</div>${body}</div>
  ${!isGuide?`<div class="card-foot">${done?'<div class="success" style="margin-bottom:9px">✓ 연결 정보 확인 완료</div>':''}
  <button class="btn primary full" onclick="${action}">${nextLabel}</button>
  ${skipRow}
  ${guideRow}
  ${setupStep>1?`<button class="btn text" onclick="prevSetup()">← 이전 단계</button>`:''}</div>`:
  `<div class="card-foot"><button class="btn full" onclick="toggleGuide(false)">← 입력으로 돌아가기</button></div>`}
  </div>`;
  const existing=$('setupCard');
  if(existing)existing.outerHTML=card;
  else addBot(card);
}
function toggleGuide(open){
  steps[setupStep].fields.forEach(([fieldId])=>{const el=$('f_'+fieldId);if(el)setupData[fieldId]=el.value;});
  guideOpen=open;renderSetupCard();
}
function prevSetup(){if(setupStep>0){setupStep--;guideOpen=false;stepError=null;renderSetupCard();}}
function verifyStep(id){
  const step=steps[setupStep];
  step.fields.forEach(([fieldId])=>{const el=$('f_'+fieldId);if(el)setupData[fieldId]=el.value.trim();});
  stepError=null;
  if(id==='github'&&!setupData.repo) stepError={field:'repo',msg:'저장소 주소를 입력해 주세요.'};
  else if(id==='notion'&&!setupData.notionPage&&setupData.notionToken) stepError={field:'notionPage',msg:'팀 정보 페이지 링크를 입력해 주세요.'};
  const rule=tokenRules[id];
  if(!stepError&&rule){
    const v=setupData[rule.field]||'';
    if(!v) stepError={field:rule.field,msg:'토큰을 입력해 주세요.',guide:true};
    else if(!rule.re.test(v)) stepError={field:rule.field,msg:rule.format,guide:true};
    else if(v.length<20) stepError={field:rule.field,msg:rule.auth,guide:true};
  }
  if(!stepError&&id==='notion'&&!setupData.notionPage) stepError={field:'notionPage',msg:'팀 정보 페이지 링크를 입력해 주세요.'};
  if(stepError){verified[id]=false;renderSetupCard();return;}
  verified[id]=true;
  toast(id==='github'?'GitHub 연결을 확인했어요. (시뮬레이션)':'노션 연결을 확인했어요. 팀 연결이 끝났어요. (시뮬레이션)');
  if(id==='notion')teamRegistered=true;  // 노션이 확인되면 팀 연결 저장(구현과 같음)
  if(setupStep<steps.length-1){setupStep++;guideOpen=false;renderSetupCard();}
}
function finishSetup(github,board){
  if($('setupDone'))return;
  teamRegistered=true;
  const existing=$('setupCard');if(existing)existing.removeAttribute('id');
  addBot(`<div class="card" id="setupDone"><div class="card-head"><strong class="done-title"><span class="done-ico"><svg viewBox="0 0 16 16" width="10" height="10"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>준비 끝! 🎉</strong><p>팀원들은 들어오면 역할만 고르면 돼요.</p></div><div class="card-body" style="min-height:0"><div class="info-grid">
   <span>Notion</span><b class="success">연결됨</b>
   <span>GitHub</span>${github?'<b class="success">연결됨</b>':'<b>나중에 <span class="muted small">(팀 설정에서 연결할 수 있어요)</span></b>'}
   ${github?`<span>작업 보드</span>${board?'<b class="success">연결됨</b>':'<b>없음</b>'}`:''}
  </div></div><div class="card-foot"><button class="btn text" onclick="quickAsk('팀 현황 알려줘')">팀 현황 먼저 보기 →</button></div></div>`);
  addBot(`<div class="bubble"><span class="spin"></span>팀 노션 자료를 처음 읽고 있어요. 2분쯤 걸려요.<br><span class="muted small">그동안 메뉴는 쓸 수 있어요. 팀 현황은 읽은 만큼만 보이고, 다 읽으면 알려드릴게요.</span></div>${note('<b>대기 화면 · 5초 이상</b>: 기다리게 하지 않고 백그라운드로 돌린 뒤 끝나면 알림. 첫 노션 수집 실측 약 120초 (report-2026-11-03). 시안에서는 8초 뒤 완료 알림.')}`);
  addBot(menuCard());
  setTimeout(()=>{addBot(`<div class="bubble"><span class="done-title"><span class="done-ico"><svg viewBox="0 0 16 16" width="10" height="10"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>팀 자료를 다 읽었어요</span><br><span class="muted small">이제 팀 현황에 전체 내용이 보여요.</span><div class="quick"><button onclick="quickAsk('팀 현황 알려줘')">팀 현황 보기</button></div></div>`);},8000);
}

let roleCardSeq=0;
function renderRoleCard(){
  const n=++roleCardSeq,isOther=myRole&&!roles.slice(0,-1).includes(myRole);
  const sel=isOther?'기타':myRole;
  addBot(`<div class="card" id="roleCard${n}"><div class="card-head"><div class="tag">개인 설정</div><strong style="display:block;margin-top:9px">내 정보를 설정해 주세요</strong><p>역할을 알려주시면 담당 업무와 협업 상황에 맞춰 안내하겠습니다.</p></div><div class="card-body" style="min-height:0">
  <div class="field"><label>내 역할</label><select id="role${n}" onchange="onRoleChange(${n})"><option value="">선택하세요</option>${roles.map(r=>`<option ${r===sel?'selected':''}>${r}</option>`).join('')}</select></div>
  <div class="field ${sel==='기타'?'':'hidden'}" id="roleOtherWrap${n}"><label>역할 직접 입력</label><input id="roleOther${n}" placeholder="내 역할을 입력해 주세요" value="${isOther?escapeHtml(myRole):''}" oninput="onRoleChange(${n})"></div>
  </div><div class="card-foot"><div class="foot-meta"><span>설정은 언제든 변경할 수 있습니다.</span><span>1 / 1</span></div><button class="btn primary full" id="roleSave${n}" onclick="saveRole(${n})" disabled>저장하기</button></div></div>`);
  onRoleChange(n);
}
function roleValue(n){const s=$('role'+n).value;return s==='기타'?$('roleOther'+n).value.trim():s;}
function onRoleChange(n){
  const s=$('role'+n).value;
  $('roleOtherWrap'+n).classList.toggle('hidden',s!=='기타');
  $('roleSave'+n).disabled=!roleValue(n);
}
function saveRole(n){
  const v=roleValue(n);if(!v)return;
  myRole=v;
  $('roleSave'+n).disabled=true;$('roleSave'+n).textContent='저장됨';
  $('role'+n).disabled=true;$('roleOther'+n).disabled=true;
  addBot(`<div class="bubble"><span class="done-title"><span class="done-ico"><svg viewBox="0 0 16 16" width="10" height="10"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>설정이 완료되었어요</span><br><span class="muted small">내 역할: ${escapeHtml(v)}</span></div>`);
  addBot(menuCard());
}

 const input=$('messageInput'),q=input.value.trim();if(!q)return;input.value='';addUser(q);handleMessage(q);

function handleMessage(q){
 const t=q.toLowerCase().trim();
 // 공통: 메뉴로 돌아오기
 if(t==='메뉴'||t==='처음으로'||t==='☰ 메뉴로'){qaMode=false;addBot(menuCard());return;}

  return;
 }
 // 팀 연결 전에는 기능 메뉴를 막고 설정으로 안내
 if(scenario==='A'&&!teamRegistered&&/팀 현황|업무 확인|질문/.test(t)){
  addBot(`<div class="bubble">먼저 팀을 연결해야 쓸 수 있어요. 노션만 연결하면 바로 시작할 수 있어요.</div><div class="quick"><button onclick="startSetup()">초기 설정 시작</button></div>`);return;
 }
 if(t.includes('내 정보')){qaMode=false;addBot(`<div class="bubble">${myRole?`현재 역할은 <b>${escapeHtml(myRole)}</b>이에요. 바꾸려면 아래에서 다시 선택하세요.`:'아직 역할이 설정되지 않았어요. 아래에서 선택해 주세요.'}</div>`);renderRoleCard();return;}
 if(t.includes('팀 설정')){qaMode=false;renderTeamSettings();return;}
 if(t.includes('노션 페이지 바꾸기')){renderNotionChange();return;}
 if(t.includes('팀 현황')){qaMode=false;showTeamStatus();return;}
 if(t.includes('조율')){showCoordination();return;}
 if(t.includes('팀원별')){showMembers();return;}
 if(t.includes('이슈 제안')){showIssueProposal();return;}
 if(t.includes('업무 확인')){qaMode=false;showMyWork();return;}
 if(t.includes('작업물 공유')){showShareSelect();return;}
 if(t.includes('자료 올리기')){showUpload();return;}
 if(t.includes('pm bot에게 질문')||t==='질문'||t.includes('질문할게')){qaMode=true;showAskPrompt();return;}
 if(qaMode){answerQuestion(q);return;}
 addBot(`<div class="bubble">이렇게 물어보시면 바로 찾아볼게요. 아니면 메뉴에서 골라 주세요.</div><div class="quick"><button onclick="quickAsk('PM Bot에게 질문할게')">질문으로 물어보기</button><button onclick="quickAsk('메뉴')">☰ 메뉴로</button></div>${note('<b>결정:</b> 메뉴 밖 자유 입력은 안내만 하고 질문하기로 자동으로 넘기지 않음.')}`);
}

function coordItemHtml(c){

 return `<div class="coord-item ${st?'done':''}" id="ci_${c.id}"><b>${c.title}</b>${c.guess?'<span class="chip guess">추정</span>':''}<div class="why">${c.why}</div>

function coordAct(id,act){
 const c=coordItems.find(x=>x.id===id);
 if(act==='decide'){renderDecisionInput(c);return;}
 coordState[id]=act;
 const el=$('ci_'+id);if(el)el.outerHTML=coordItemHtml(c);
 toast(act==='agenda'?'다음 회의 안건에 넣었어요':'보류했어요');
}
function renderDecisionInput(c){
 const n=++seq;
 addBot(`<div class="card" id="dec${n}"><div class="card-head"><div class="tag">결정 기록</div><strong style="display:block;margin-top:9px">${c.title}</strong><p>정해진 내용을 직접 적어 주세요. AI 문장은 결정으로 저장되지 않아요.</p></div>

}

}

/* ── PM Bot 질문 ────────────────────────────────── */
function showAskPrompt(){
 addBot(`<div class="bubble">무엇이든 물어보세요. 팀 문서와 GitHub 기록에서 찾아서 근거와 함께 답할게요.</div><div class="quick"><button onclick="quickAsk('지난 회의에서 로그인 방식 정해졌어?')">지난 회의에서 로그인 방식 정해졌어?</button><button onclick="quickAsk('API 인증 모듈 구현됐어? 어디 있어?')">API 인증 모듈 구현됐어?</button><button onclick="quickAsk('메뉴')">☰ 메뉴로</button></div>${note('질문 모드는 [☰ 메뉴로] 또는 다른 메뉴를 고를 때까지 유지. 질문할 때마다 노션 전체를 다시 읽지 않음 (PRD FR-11).')}`);
}
function answerQuestion(q){
 const impl=/구현|어디/.test(q);
 withLoading('관련 기록을 찾는 중이에요…',1500,()=>`<div class="card"><div class="card-head"><strong>답변</strong><p>${escapeHtml(q)}</p></div>
 <div class="card-body" style="min-height:0"><p style="margin:0 0 14px;line-height:1.65">${impl?'API 인증 모듈은 <b>진행 중</b>이에요. 이슈 #12가 열려 있고, 관련 코드는 <code>src/auth/</code>에 있어요. 병합된 PR은 아직 없어요.':'<b>아직 정해지지 않았어요.</b> 11/7 회의에서 소셜 로그인과 이메일 가입 두 안이 논의됐지만 합의 기록은 없어요.'}</p>
 <div class="section-label">근거</div><ul class="src">${impl?'<li><a href="#" onclick="return false">이슈 #12</a> <span class="chip gh">GitHub</span></li><li><a href="#" onclick="return false">src/auth/token.py</a> <span class="chip guess">추정 연결</span></li>':'<li><a href="#" onclick="return false">11/7 회의록 · 3번째 안건</a> <span class="chip draft">논의</span></li><li><a href="#" onclick="return false">요구사항 정리 · 로그인</a> <span class="chip draft">가안</span></li>'}</ul>
 <p class="muted small" style="margin-top:8px">찾아본 범위: Notion 문서 12개, GitHub 이슈·PR · 보지 못한 것: 디자인 폴더 (연결 안 됨)</p></div>
 <div class="card-foot"><div class="btn-row"><button class="btn" onclick="toast('다음 회의 안건에 넣었어요')">다음 회의 안건으로</button><button class="btn" onclick="$('messageInput').focus()">이어서 질문</button></div>${navRow()}</div></div>${note('답 · 근거 · 찾아본 범위 · 보지 못한 것을 항상 함께 (PRD FR-09). "기록 없음"은 "없었다"가 아님. <b>대기 · 1~5초</b> (실측 미측정).')}`);
}

/* ── 설정 > 팀 설정 ─────────────────────────────── */
function renderTeamSettings(){
 addBot(`<div class="card"><div class="card-head"><strong>팀 설정</strong><p>팀 공통 연결이에요. 바꾸면 팀원 모두에게 적용돼요.</p></div><div class="card-body" style="min-height:0">
 <div class="info-grid"><span>팀</span><b>SEAM 파일럿</b><span>Notion</span><b class="success">연결됨 · 팀 정보 페이지</b><span>GitHub</span><b class="success">연결됨</b><span>작업 보드</span><b class="success">연결됨</b></div></div>
 <div class="card-foot"><div class="btn-row"><button class="btn" onclick="quickAsk('노션 페이지 바꾸기')">노션 페이지 바꾸기</button><button class="btn" onclick="toast('GitHub 저장소·토큰 변경 · 시안 생략')">GitHub 바꾸기</button></div>${navRow()}</div></div>${note('01-setup에서 남긴 "잘못 넣은 노션 페이지를 바꾸는 경로"를 여기 둠.')}`);
}
function renderNotionChange(){
 const n=++seq;
 addBot(`<div class="card" id="nc${n}"><div class="card-head"><div class="tag">팀 설정 · Notion</div><strong style="display:block;margin-top:9px">새 노션 페이지를 알려 주세요</strong><p>연결 토큰은 그대로 써요.</p></div>
 <div class="card-body" style="min-height:0"><div class="field"><label>페이지 링크</label><input id="ncLink${n}" placeholder="https://www.notion.so/team-page"></div></div>
 <div class="card-foot"><button class="btn primary full" onclick="doNotionChange(${n})">바꾸기</button></div></div>`);
}
function doNotionChange(n){
 if(!$('ncLink'+n).value.trim()){toast('페이지 링크를 입력해 주세요.');return;}
 $('nc'+n).querySelector('.card-foot').innerHTML='<div class="muted"><span class="spin"></span>페이지에 들어갈 수 있는지 확인하는 중…</div>';
 setTimeout(()=>{$('nc'+n).querySelector('.card-foot').innerHTML=`<div class="success">✓ 페이지를 바꿨어요 · ‘SEAM 파일럿 팀 정보’</div>`;
  addBot(`<div class="bubble"><span class="spin"></span>새 페이지를 읽고 있어요. 몇 분 걸려요. 다 되면 알려드릴게요.</div><div class="quick"><button onclick="quickAsk('메뉴')">☰ 메뉴로</button></div>`);},1200);
}

renderInitial();
</script>
</body>
</html>
