<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구조 보기·고치기</title>
<style>
:root {
  --bg: #f5f5f8; --panel: #ffffff; --line: #e3e3ea; --line-strong: #cfcfd8;
  --text: #1f2328; --muted: #5f6670; --faint: #8a9099;
  --brand: #5b5fc7; --brand-strong: #4a4fb5; --brand-soft: #eef0ff; --on-brand: #ffffff;
  --amber: #b26a00; --amber-soft: #fff4e2; --green: #2f7d4f; --green-soft: #e8f5ec;
  --violet: #6b4bc7; --violet-soft: #f1ecff; --blue: #2d6bcf; --blue-soft: #e9f1ff;
  --red: #b4232c; --red-soft: #fdecee; --shadow: 0 1px 2px rgba(20, 20, 40, .06);
}
:root[data-theme="dark"] {
  --bg: #1b1b22; --panel: #26262f; --line: #383844; --line-strong: #4a4a58;
  --text: #ececf1; --muted: #b0b3bb; --faint: #8b8f99;
  --brand: #8b8fe8; --brand-strong: #a3a6ef; --brand-soft: #30315a; --on-brand: #16162a;
  --amber: #f0b45a; --amber-soft: #3d3020; --green: #6fcf97; --green-soft: #1f3529;
  --violet: #b39cf5; --violet-soft: #2f2747; --blue: #84b2f5; --blue-soft: #1f2b40;
  --red: #f2858c; --red-soft: #402226; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 40px; }

.banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--brand-soft); margin-bottom: 16px; }
.banner .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); display: grid; place-items: center; flex-shrink: 0; color: var(--brand); }
.banner b { display: block; }
.banner small { color: var(--muted); }
.banner .grow { flex: 1; min-width: 0; }
.icon-btn { border: none; background: none; color: var(--muted); padding: 6px; border-radius: 6px; line-height: 0; }
.icon-btn:hover { background: var(--line); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
.stage { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.stage .pill { font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.stage .pill.tentative { border-style: dashed; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-strong); font-weight: 600; }
.chip[aria-pressed="true"] .n { background: var(--brand); color: var(--on-brand); border-radius: 999px; padding: 0 7px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
.filters label { color: var(--muted); font-weight: 600; }
.filters select, .filters input { height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 0 10px; }
.filters input { flex: 1; min-width: 200px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.sec-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.sec-head .badge { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
.sec-head h2 { font-size: 15px; margin: 0; }
.sec-head .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-desc { padding: 0 14px 6px; margin-top: -6px; color: var(--muted); font-size: 12.5px; }
.t-amber .badge { background: var(--amber-soft); color: var(--amber); }
.t-green .badge { background: var(--green-soft); color: var(--green); }
.t-violet .badge { background: var(--violet-soft); color: var(--violet); }
.t-blue .badge { background: var(--blue-soft); color: var(--blue); }
.t-gray .badge { background: var(--bg); color: var(--muted); }
.rows { list-style: none; margin: 0; padding: 0 8px 8px; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--bg); }
.row[aria-selected="true"] { background: var(--brand-soft); border-color: var(--brand); }
.row .title { flex: 1; min-width: 0; }
.row .sub { display: block; color: var(--muted); font-size: 12.5px; }
.row .doc { color: var(--faint); flex-shrink: 0; line-height: 0; }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.answers { display: flex; gap: 4px; flex-shrink: 0; }
.answers button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 1px 10px; font-size: 12.5px; }
.answers .a-confirm:hover { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.answers .a-open:hover { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }
.answers .a-ignore:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.change { padding: 10px 8px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
.change + .change { border-top: 1px solid var(--line); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow .old { color: var(--muted); text-decoration: line-through; }
.flow .arrow { color: var(--violet); }
.flow a { color: inherit; text-decoration: none; cursor: pointer; }
.flow a:hover { text-decoration: underline; }
.change .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.change .meta button { margin-left: auto; }
.empty-sec { padding: 4px 16px 14px; color: var(--muted); }

.btn { height: 36px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--panel); font-weight: 600; }
.btn:hover:not(:disabled) { background: var(--bg); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover:not(:disabled) { background: var(--brand-strong); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 500; }
.btn.danger { color: var(--red); }

.panel { position: sticky; top: 12px; padding: 16px; max-height: calc(100vh - 24px); overflow: auto; }
.panel h3 { margin: 0 0 14px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.panel h3 .close { margin-left: auto; display: none; }
.field { margin-bottom: 14px; }
.field > label, .field > .label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); padding: 7px 10px; }
.field textarea { resize: vertical; min-height: 64px; }
.field input:disabled, .field select:disabled, .field textarea:disabled { background: var(--bg); color: var(--muted); }
.src { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.src .head { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.src .date { color: var(--muted); font-weight: 400; }
.src blockquote { margin: 8px 0 6px; padding: 6px 10px; border-left: 3px solid var(--brand); background: var(--bg); border-radius: 0 6px 6px 0; color: var(--muted); }
.src a { color: var(--brand-strong); font-size: 12.5px; }
.hist { list-style: none; padding: 0; margin: 0; }
.hist li { position: relative; padding: 0 0 12px 18px; font-size: 13px; }
.hist li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--brand); background: var(--panel); }
.hist li::after { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
.hist li:last-child::after { display: none; }
.hist .when { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.hist .who { color: var(--faint); }
.actions { display: flex; gap: 8px; margin-top: 6px; }
.actions .btn { flex: 1; }
.readonly { color: var(--muted); font-size: 12.5px; margin: -6px 0 12px; }
.placeholder { color: var(--muted); padding: 32px 8px; text-align: center; }

.state { max-width: 520px; margin: 80px auto; text-align: center; color: var(--muted); }
.state b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: calc(100% - 32px); z-index: 20; }
.toast[hidden] { display: none; }
.scrim { display: none; }
.mat { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.mat-agreed { background: var(--green-soft); color: var(--green); border-color: transparent; }
.mat-discussed { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.mat-recommended { background: var(--violet-soft); color: var(--violet); border-color: transparent; }
.mat-draft { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.flag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--red-soft); color: var(--red); white-space: nowrap; flex-shrink: 0; }
.flag.soft { background: var(--bg); color: var(--muted); }
.md { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); overflow-wrap: anywhere; }
.md h4, .md h5 { margin: 8px 0 4px; font-size: 14px; }
.md p { margin: 4px 0; }
.md ul, .md ol { margin: 4px 0; padding-left: 20px; }
.md a { color: var(--brand-strong); }
.rel { list-style: none; margin: 0; padding: 0; }
.rel li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--line); }
.rel li:last-child { border-bottom: none; }
.rel .kindname { color: var(--muted); font-size: 12.5px; flex-shrink: 0; min-width: 78px; }
.rel a { cursor: pointer; color: var(--brand-strong); }
.rel .gone, .row .gone { color: var(--muted); text-decoration: line-through; }
.note { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.note.warn { color: var(--amber); }
.panel > .note { margin: 0 0 12px; }
details.fold > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
details.fold[open] > summary { padding-bottom: 6px; }
.stage button.pill { cursor: pointer; font: inherit; font-weight: 600; color: inherit; }
.stage button.pill:hover { background: var(--brand-soft); }
dialog.stages { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 18px 20px; width: min(520px, calc(100% - 32px)); box-shadow: 0 8px 32px rgba(0,0,0,.25); }
dialog.stages::backdrop { background: rgba(0,0,0,.35); }
dialog.stages h3 { margin: 0 0 4px; font-size: 16px; }
dialog.stages p { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
.steps { list-style: none; margin: 0 0 14px; padding: 0; }
.steps li { padding: 8px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: baseline; }
.steps li.current { background: var(--brand-soft); font-weight: 600; }
.steps li.done { color: var(--muted); }
.steps .mark { width: 16px; text-align: center; color: var(--brand); flex-shrink: 0; }
.steps .gates { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }

@media (max-width: 900px) {
  .wrap { padding: 12px 16px 32px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: fixed; inset: auto 0 0 0; top: auto; max-height: 85vh; border-radius: 14px 14px 0 0; z-index: 10; transform: translateY(105%); transition: transform .2s; }
  .panel.open { transform: none; }
  .panel h3 .close { display: inline-flex; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 9; }
  .answers button { padding: 1px 8px; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="state"><b>불러오는 중…</b></div></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/teams-js@2.24.0/dist/MicrosoftTeams.min.js"></script>
<script>
"use strict";
const ICON = {
  bell: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  alert: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  history: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
  question: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"/></svg>',
  list: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
};
const S = { token: null, data: null, kind: "all", source: "", q: "", hits: null, selected: null, saving: false };
const REL = {  // 관계 종류 → [이 항목이 시작일 때, 이 항목이 대상일 때]
  SUPERSEDES: ["이 항목이 대체함", "이 항목을 대체한 결정"], RESOLVES: ["이 항목이 해결함", "이 미정을 해결한 항목"],
  ALTERNATIVE_TO: ["이 항목의 대상 결정(이 항목은 대안)", "이 결정의 대안"], DERIVED_FROM: ["이 항목이 나온 문서", "이 문서에서 나온 항목"],
  AFFECTS: ["영향을 주는 대상", "영향을 받음"], RELATED_TO: ["관련·충돌 가능", "관련·충돌 가능"],
};
const STATUS_TEXT = { superseded: "대체됨", reverted: "되돌림", cancelled: "삭제됨", resolved: "해결됨", needs_discussion: "확인 필요" };

// ── 작은 DOM 도우미: 회의록 내용은 모두 textContent로 넣는다 ──
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
const day = (iso) => (iso || "").slice(0, 10).replaceAll("-", ".");
let toastTimer;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}
function store(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
}

// ── 입장: 링크의 ?t= 또는 Teams 탭 딥 링크의 subPageId ──
async function findToken() {
  const fromUrl = new URLSearchParams(location.search).get("t");
  if (fromUrl) {  // 주소창·방문 기록에 토큰이 남지 않게 지우고, 새로고침용으로 이 탭에만 둔다
    try { sessionStorage.setItem("board-token", fromUrl); } catch (e) { /* 저장 못 해도 이번 화면은 연다 */ }
    history.replaceState(null, "", location.pathname);
    return fromUrl;
  }
  try { const kept = sessionStorage.getItem("board-token"); if (kept) return kept; } catch (e) { /* 없음 */ }
  if (!window.microsoftTeams) return null;
  try {
    await Promise.race([microsoftTeams.app.initialize(), new Promise((_, no) => setTimeout(no, 2500))]);
    const ctx = await microsoftTeams.app.getContext();
    applyTheme(ctx.app && ctx.app.theme);
    microsoftTeams.app.registerOnThemeChangeHandler(applyTheme);
    return (ctx.page && ctx.page.subPageId) || null;
  } catch (e) { return null; }
}
function applyTheme(theme) {
  const dark = theme ? theme !== "default" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Authorization": "Bearer " + S.token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(payload.detail || "요청을 처리하지 못했어요 (" + res.status + ")");
  return payload;
}
function findItem(id) {
  return S.data.items.find((x) => x.id === id) || S.data.artifacts.find((x) => x.id === id) || S.data.deleted.find((x) => x.id === id);
}
async function load() {
  S.data = await api("/api/board");
  if (S.selected && !findItem(S.selected)) S.selected = null;
  render();
}
async function act(fn, done) {
  if (S.saving) return;
  S.saving = true;
  try { await fn(); toast(done); await load(); }
  catch (e) { toast(e.message); }
  finally { S.saving = false; }
}

// ── 화면 ──
function matches(i) {  // 검색어: 서버 검색(색인) 결과가 있으면 그것을, 없으면(서버 검색 실패) 화면 안에서 찾는다
  const q = S.q.trim().toLowerCase();
  if (!q) return true;
  if (S.hits) return S.hits.has(i.id);
  return (i.title + " " + i.statement + " " + (i.assignee || "")).toLowerCase().includes(q);
}
function visible() {
  return S.data.items.filter((i) =>
    (S.kind === "all" || i.kind === S.kind) &&
    (!S.source || i.sources.some((s) => (s.page_id || s.part_id) === S.source)) && matches(i));
}
function visibleArtifacts() {
  return S.data.artifacts.filter((a) => (S.kind === "all" || S.kind === "artifact") &&
    (!S.source || a.sources.some((s) => (s.page_id || s.part_id) === S.source)) && matches(a));
}
let searchTimer, searchSeq = 0;
function runSearch() {  // 입력이 멎으면 서버 검색(색인)을 부른다. 삭제·대체된 항목은 서버가 뺀다
  clearTimeout(searchTimer);
  const q = S.q.trim();
  if (!q) { S.hits = null; refocusSearch(true); return; }
  searchTimer = setTimeout(async () => {
    const mine = ++searchSeq;
    try {
      const found = await api("/api/board/search?q=" + encodeURIComponent(q));
      if (mine === searchSeq) S.hits = new Set(found.ids);
    } catch (e) { if (mine === searchSeq) S.hits = null; }
    if (mine === searchSeq) refocusSearch(true);
  }, 250);
}
function refocusSearch(rerender) {
  const input = document.querySelector('input[type="search"]');
  const pos = input ? input.selectionStart : 0, had = input && document.activeElement === input;

  const mark = { done: "✓", current: "▶", todo: "○" };
  const dlg = h("dialog", { class: "stages", "aria-label": "전체 단계" },
    h("h3", {}, "전체 단계"),
    h("p", {}, stage.approved ? "권한자가 확인한 현재 단계예요." : "회의록 분석으로 본 후보 단계예요(아직 확인 전)."),
    h("ol", { class: "steps" }, stage.steps.map((st) => h("li", { class: st.state },
      h("span", { class: "mark" }, mark[st.state]),
      h("span", {}, `${st.code} ${st.name}`, st.gates.length ? h("span", { class: "gates" }, "정할 사안: " + st.gates.join(" · ")) : "")))),
    h("button", { class: "btn", onclick: () => dlg.close() }, "닫기"));
  dlg.addEventListener("close", () => dlg.remove());
  document.body.append(dlg); dlg.showModal();
}
function fail(title, text) {
  document.getElementById("app").replaceChildren(h("div", { class: "state" }, h("b", {}, title), text));
}

document.getElementById("scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.selected) closePanel(); });
(async () => {
  applyTheme(null);
  S.token = await findToken();
  if (!S.token) return fail("봇 카드에서 열어 주세요", "PM봇 메인 카드의 [🗂 구조 보기·고치기] 버튼을 누르면 내 팀 화면이 열려요.");
  try {
    await load();
    const view = S.data.viewer.view || "";
    if (view === "stages") openStages();
    else if (view.startsWith("item:") && findItem(view.slice(5))) select(view.slice(5));  // 답·브리핑의 근거 항목으로 바로 연다
  } catch (e) { fail("화면을 열지 못했어요", e.message); }
})();
</script>
